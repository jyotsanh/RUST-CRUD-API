services:
  # Your Rust Actix-Web Application
  api:
    build: .
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080
    environment:
      # SQLite database file, stored on the named volume below
      - DATABASE_URL=sqlite:///app/data/products.db
      - RUST_LOG=info
      # Number of actix worker threads (omit to use one per CPU core)
      - WORKERS=4
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

# Define a named volume to persist the SQLite database across container restarts
volumes:
  sqlite_data:
